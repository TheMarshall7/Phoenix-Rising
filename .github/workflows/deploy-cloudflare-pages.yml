# Deploy static build to Cloudflare Pages when main or production updates.
#
# REQUIRED secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare → My Profile → API Tokens → Custom → Account → Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → any domain → sidebar "Account ID"
# Without these, this workflow fails and only "Connect to Git" deploys run (check branch/build settings).
#
# If this project name does not match your Pages project, change PROJECT_NAME below
# or override with repository variable CLOUDFLARE_PAGES_PROJECT_NAME.
#
# If you already use Cloudflare’s “Connect to Git” for the same branch, either:
#   • turn off automatic production builds for that branch in Pages settings, or
#   • delete this workflow — to avoid duplicate deploys.

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, production, main-website]
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build
        run: npm ci && npm run build

      - name: Verify build assets
        run: |
          test -f dist/index.html
          ls -la dist/assets/*.js dist/assets/*.css

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mariaamiouni
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
